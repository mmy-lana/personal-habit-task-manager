services:
  postgres:
    image: postgres:16-alpine
    container_name: phpm-postgres
    restart: unless-stopped
    ports:
      # Override with POSTGRES_HOST_PORT when host port 5432 is occupied
      # (e.g. another PostgreSQL container). Defaults to the standard 5432.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: password
      POSTGRES_DB: neondb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neondb_owner -d neondb']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - phpm-pgdata:/var/lib/postgresql/data

volumes:
  phpm-pgdata:
